name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Perl 5.44, MySQL, PostgreSQL, Valkey)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Building Perl takes a while, so the layers are cached between runs
      - name: Build the development image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: dev
          tags: sledge-dev
          load: true
          cache-from: type=gha,scope=dev
          cache-to: type=gha,scope=dev,mode=max

      - name: Run the tests
        run: docker compose run --rm dev prove -lr t

      - name: Check POD syntax
        run: |
          docker compose run --rm --no-deps dev sh -c '
            status=0
            for f in $(find lib -name "*.pm" -o -name "*.pod"); do
              podchecker "$f" >/dev/null 2>&1
              # 1 = errors; 2 = the file has no POD at all, which is fine
              if [ $? -eq 1 ]; then podchecker "$f"; status=1; fi
            done
            exit $status'

      - name: Install with Makefile.PL
        run: docker compose run --rm --no-deps dev sh -c 'cp -r /app /tmp/build && cd /tmp/build && perl Makefile.PL && make && make test'

      - name: Stop services
        if: always()
        run: docker compose down

  lint:
    name: Lint workflows and manifests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color

      - name: Validate Kubernetes manifests
        run: |
          for overlay in k8s/base k8s/local; do
            echo "== $overlay"
            kubectl kustomize "$overlay" \
              | docker run --rm -i ghcr.io/yannh/kubeconform:v0.8.0@sha256:faffaf43f95aa6425306e1ab8d6fcad72acb9049158f38e574c085ea1ec0f64e -strict -summary -
          done

  e2e:
    name: End-to-end on kind
    needs: [test, lint]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Release name
        id: rev
        run: echo "rev=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          tags: sledge:${{ steps.rev.outputs.rev }}
          load: true
          build-args: |
            GIT_REVISION=${{ github.sha }}
          cache-from: |
            type=gha,scope=dev
            type=gha,scope=runtime-amd64
          cache-to: type=gha,scope=runtime-amd64,mode=max

      - uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          cluster_name: sledge

      - name: Release to kind
        run: SKIP_BUILD=1 scripts/release kind

      - name: Check the app and the chat through the edge proxy
        run: |
          image="sledge:${{ steps.rev.outputs.rev }}"
          kubectl -n sledge create configmap e2e --from-file=e2e-chat=scripts/e2e-chat
          kubectl -n sledge run e2e --image="$image" --restart=Never --overrides="$(cat <<JSON
          {"spec": {"enableServiceLinks": false,
            "containers": [{"name": "e2e", "image": "$image",
              "command": ["perl", "/e2e/e2e-chat", "http://edge"],
              "volumeMounts": [{"name": "e2e", "mountPath": "/e2e"}]}],
            "volumes": [{"name": "e2e", "configMap": {"name": "e2e"}}]}}
          JSON
          )"
          kubectl -n sledge wait pod/e2e --for=jsonpath='{.status.phase}'=Succeeded --timeout=120s || {
            kubectl -n sledge logs e2e; exit 1; }
          kubectl -n sledge logs e2e

      - name: Show cluster state on failure
        if: failure()
        run: |
          kubectl -n sledge get pods -o wide
          kubectl -n sledge describe pods
          kubectl -n sledge logs -l app.kubernetes.io/name=sledge --all-containers --tail=100
          kubectl -n sledge logs -l app.kubernetes.io/name=sledge-ws --tail=100
