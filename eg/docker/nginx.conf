# Development reverse proxy: / goes to the Sledge app, /ws to the WebSocket server.
# This mirrors what an Ingress does in Kubernetes.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8000;

    location / {
        proxy_pass http://app:5000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws {
        proxy_pass http://ws:5001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-Id $request_id;
        # Longer than the server's ping interval, so idle sockets are not cut
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
