<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sledge chat</title>
<style>
  body { font-family: sans-serif; max-width: 40rem; margin: 2rem auto; padding: 0 1rem; }
  #log { border: 1px solid #ccc; height: 20rem; overflow-y: auto; padding: .5rem; }
  #log p { margin: .2rem 0; }
  .system { color: #777; font-style: italic; }
  #status { font-size: .9rem; color: #777; }
  form { display: flex; gap: .5rem; margin-top: .5rem; }
  #text { flex: 1; }
</style>
</head>
<body>
<h1>Chat</h1>
<p>Signed in as <strong>[% name | html %]</strong> &middot; <span id="status">connecting...</span></p>
<div id="log"></div>
<form id="form"><input id="text" autocomplete="off" maxlength="500"><button>Send</button></form>
<script>
(function () {
  var log = document.getElementById('log');
  var status = document.getElementById('status');
  var form = document.getElementById('form');
  var input = document.getElementById('text');
  var socket, attempts = 0;

  function line(text, cls) {
    var p = document.createElement('p');
    p.textContent = text;
    if (cls) p.className = cls;
    log.appendChild(p);
    log.scrollTop = log.scrollHeight;
  }

  function connect() {
    var url = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws';
    socket = new WebSocket(url);
    socket.onopen = function () { status.textContent = 'connected'; };
    socket.onmessage = function (event) {
      var msg = JSON.parse(event.data);
      if (msg.type === 'welcome') attempts = 0;
      if (msg.type === 'say')   line(msg.user + ': ' + msg.text);
      if (msg.type === 'join')  line(msg.user + ' joined', 'system');
      if (msg.type === 'leave') line(msg.user + ' left', 'system');
      if (msg.type === 'error') line('error: ' + msg.error, 'system');
    };
    socket.onclose = function (event) {
      if (event.code === 4401) {          // no session: go back and sign in
        location.href = '/';
        return;
      }
      // Reconnect with exponential backoff and jitter (e.g. when a pod restarts)
      var delay = Math.min(30000, 500 * Math.pow(2, attempts++)) * (0.5 + Math.random() / 2);
      status.textContent = 'reconnecting in ' + Math.round(delay / 1000) + 's (code ' + event.code + ')';
      setTimeout(connect, delay);
    };
  }

  form.addEventListener('submit', function (event) {
    event.preventDefault();
    if (!input.value.trim() || !socket || socket.readyState !== WebSocket.OPEN) return;
    socket.send(JSON.stringify({ type: 'say', text: input.value }));
    input.value = '';
  });

  connect();
})();
</script>
</body>
</html>
